{{- /*
  NiFi's sensitive properties key. It encrypts every sensitive value in the flow -
  including the database credentials the bundled flow's DatabaseService holds, which
  appear as enc{...} in data/conf/flow.json.gz - so anyone holding the NiFi data volume
  and this key can read all of them. The previous default was a constant published in
  this chart, identical in every deployment; it is now generated per release.

  Generated on first install and preserved on upgrade. Losing or changing it makes the
  existing flow's enc{...} values undecryptable: NiFi will fail to start or ghost the
  affected components, and recovery means re-keying with NiFi's own tooling before the
  change, or discarding flow.json.gz and re-entering every connector credential.

  That is why resource-policy is keep - the NiFi PVC is retained across `helm uninstall`,
  so the key has to be too, or a reinstall meets a flow it cannot decrypt.

  Deliberately NOT covered by the pod's checksum annotations: this value must never
  trigger an automatic restart.
*/}}
{{- if and .Values.nifi.enabled (not .Values.nifi.existingSensitivePropsSecret) }}
{{- $name := include "idol-connector-management.nifi.sensitivePropsSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.nifi) | nindent 4 }}
    app: "{{ include "idol-connector-management.nifi.fullname" . }}"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* NiFi requires at least 12 characters; the schema enforces that on any value set
         through nifi.sensitivePropsKey, and the generated one is 32. */}}
  sensitive-props-key: {{ include "idol-connector-management.secretValue" (dict "root" . "name" $name "key" "sensitive-props-key" "explicit" .Values.nifi.sensitivePropsKey "generate" true) }}
{{- end }}
