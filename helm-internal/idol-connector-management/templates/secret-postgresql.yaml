{{- /*
  Database credentials for the whole release: read by the api, by the bundled NiFi, and -
  via postgresql.postgresql.existingSecret / postgresql.pgpool.existingSecret - by the
  postgresql-ha sub-chart. The key names are the ones bitnami's secretKeyRefs expect
  (`password`, `repmgr-password`, `admin-password`, `postgres-password`), which is what
  lets one Secret serve all three.

  Passwords for the bundled database are generated on first install and preserved on
  upgrade. The sub-chart can generate its own, but with a bare `randAlphaNum 10` and no
  lookup, so every upgrade would mint a new password while PGDATA kept the old one.

  Not rendered when postgresql.existingSecret names a Secret you manage yourself.

  resource-policy: keep because the password must outlive `helm uninstall` for as long as
  the PGDATA volume does - StatefulSet PVCs are retained, so a reinstall would otherwise
  meet an old database with a new password. See the cleanup notes in NOTES.txt.
*/}}
{{- $configured := include "idol-connector-management.postgresql.configured" . }}
{{- $name := include "idol-connector-management.postgresql.secretName" . }}
{{- /*
  The sub-chart is pointed at this Secret by two of its own values, which it templates in
  its own context. If they disagree with the name resolved here, the api reads one Secret
  while PostgreSQL reads another - the pods just fail to authenticate, with nothing
  pointing at the cause. Compare them here and fail the render instead. Resolved with tpl
  in THIS context, which is valid because the default only references .Release.
*/}}
{{- if .Values.postgresql.enabled }}
{{- range $key, $sub := (dict "postgresql.postgresql.existingSecret" .Values.postgresql.postgresql.existingSecret "postgresql.pgpool.existingSecret" .Values.postgresql.pgpool.existingSecret) }}
{{- $resolved := tpl ($sub | default "") $ }}
{{- if ne $resolved $name }}
{{- fail (printf "\n\nMismatched PostgreSQL credential Secret.\n\n  %s resolves to %q\n  but the chart will use              %q\n\nThe api, the bundled NiFi and the postgresql-ha sub-chart must all read the same Secret.\nSet postgresql.existingSecret and both sub-chart existingSecret values to the same name,\nand remember the sub-chart templates its copy in its own context - only .Release is\nmeaningful there, so do not reference .Values.name or fullnameOverride in it.\n" $key $resolved $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $configured (not (include "idol-connector-management.postgresql.existingSecret" .)) }}
{{- $pg := include "idol-connector-management.postgresql" . | fromYaml }}
{{- $bundled := .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.connectorManagement) | nindent 4 }}
    app: "{{ include "idol-connector-management.fullname" . }}"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* Generated only for the bundled database. An external instance already has its
         credentials; inventing one would just fail to authenticate. */}}
  password: {{ include "idol-connector-management.secretValue" (dict "root" . "name" $name "key" "password" "explicit" $pg.password "generate" $bundled) }}
{{- if $bundled }}
  repmgr-password: {{ include "idol-connector-management.secretValue" (dict "root" . "name" $name "key" "repmgr-password" "explicit" .Values.postgresql.postgresql.repmgrPassword "generate" true) }}
  admin-password: {{ include "idol-connector-management.secretValue" (dict "root" . "name" $name "key" "admin-password" "explicit" .Values.postgresql.pgpool.adminPassword "generate" true) }}
{{- /* bitnami only references postgres-password when the application user is not the
       superuser, and its own Secret omits the key in that case too. */}}
{{- if ne ($pg.username | toString) "postgres" }}
  postgres-password: {{ include "idol-connector-management.secretValue" (dict "root" . "name" $name "key" "postgres-password" "explicit" .Values.postgresql.postgresPassword "generate" true) }}
{{- end }}
{{- end }}
{{- end }}
