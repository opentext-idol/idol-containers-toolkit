{{- /*
  Sensitive api configuration, kept out of the ConfigMap. Anything set under
  connectorManagement.secretEnv lands here instead of in `env`, plus the NiFi API
  password. Mounted with envFrom, so the keys are the property env var names exactly as
  the entrypoint expects them - e.g.
  CONNECTORS_STORAGE_PROVIDER_GOOGLECLOUD_PRIVATEKEY.

  Values are still visible to anything that can read Secrets in this namespace; the gain
  over a ConfigMap is that Secrets are separately RBAC-controlled and can be encrypted at
  rest. For stronger separation, leave secretEnv empty and use
  connectorManagement.envFrom with your own secretRef.
*/}}
{{- if .Values.connectorManagement.enabled }}
{{- $data := include "idol-connector-management.secretEnv.data" . | fromYaml }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "idol-connector-management.secretEnvName" . }}
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.connectorManagement) | nindent 4 }}
    app: "{{ include "idol-connector-management.fullname" . }}"
type: Opaque
data: {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
