{{- /* Read access to this release's namespace for the bundled Prometheus, in place of the
       sub-chart's ClusterRole (prometheus.rbac.create is false by default). Its one scrape job
       discovers pods in its own namespace only, so this is all it needs - and being namespaced,
       it lets any number of releases each run one. Skipped when prometheus.rbac.create is
       turned back on, since the sub-chart then grants its own, cluster-wide. */}}
{{- if and .Values.prometheus.enabled (not .Values.prometheus.rbac.create) }}
{{- $name := printf "%s-prometheus-pods" (include "idol-connector-management.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.connectorManagement) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.connectorManagement) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "idol-connector-management.prometheus.serverServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
