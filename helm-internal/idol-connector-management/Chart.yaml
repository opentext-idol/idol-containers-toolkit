apiVersion: v2
appVersion: "27.1"
dependencies:
- name: idol-library
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.16.0
- alias: postgresql
  condition: postgresql.enabled
  name: postgresql-ha
  repository: '@bitnami-charts'
  version: 14.3.4
- alias: documentsecurity
  condition: documentsecurity.enabled
  name: idol-documentsecurity
  repository: '@cs-kd-helm-dev'
  version: 27.1.0-SNAPSHOT
- condition: prometheus.enabled
  name: prometheus
  repository: '@prometheus'
  version: 25.0.0
description: A configurable IDOL Connector Management API setup
name: idol-connector-management
version: 27.1.0-SNAPSHOT
